<div class="loader loader__new-session">
  <div class="loader__wrapper">

    <div class="loader__welcome welcome__message">
      <span>Welcome to</span>
      <br>
      <span>Limitless Earth</span>
    </div>

    <div class="loader__planet"></div>

    <div class="loader__welcome control__message">
      Control the app

      @if (controlMode === null) {
        <div class="loader__control-buttons">
          <button
            class="loader__control-button loader__local-control loader__wrapper--input"
            type="button"
            (click)="chooseControl('local')">
            Local
          </button>
          <button
            class="loader__control-button loader__remote-control loader__wrapper--input"
            type="button"
            (click)="chooseControl('remote')">
            Remote
          </button>
        </div>
      }

      @if (controlMode === 'local') {
        <div class="loader__redirect redirect__local">
          <div class="loader__control-buttons">
            <button
              class="loader__local-button loader__wrapper--input"
              type="button"
              (click)="goToApp()">
              Go to app
            </button>
          </div>
        </div>
      }

      @if (controlMode === 'remote') {
        <div class="loader__redirect redirect__remote">
          Insert the code in mobile browser
          <div class="loader__control-buttons">
            <button class="loader__remote-button loader__wrapper--input" type="button" disabled>
              {{ pin || '···· ' }}
            </button>
          </div>
        </div>
      }

    </div>
  </div>
</div>
