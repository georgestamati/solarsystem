<!-- Feature 9: Theme toggle -->
<button
  class="theme-btn"
  type="button"
  (click)="theme.toggle()"
  [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  [attr.title]="theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
>{{ theme.theme() === 'dark' ? '☀' : '🌙' }}</button>

<!-- Feature 8: Audio mute toggle -->
<button
  class="mute-btn"
  type="button"
  (click)="audio.toggleMute()"
  [attr.aria-label]="audio.isMuted() ? 'Unmute audio' : 'Mute audio'"
  [attr.title]="audio.isMuted() ? 'Unmute audio' : 'Mute audio'"
>{{ audio.isMuted() ? '🔇' : '🔊' }}</button>

<!-- Feature 4: Compare button -->
<a class="compare-btn" routerLink="/compare" aria-label="Compare planets">⚖ Compare</a>

<app-menu [planets]="planets()"></app-menu>

<!-- Feature 7: Fullscreen toggle -->
<button
  class="fullscreen-btn"
  type="button"
  (click)="fullscreen.toggle()"
  [attr.aria-label]="fullscreen.isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
  [attr.title]="fullscreen.isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
>{{ fullscreen.isFullscreen() ? '✕' : '⤢' }}</button>

<!-- Feature 2: Orbit speed control panel -->
<div class="speed-control" role="group" aria-label="Orbit speed control">
  <span class="speed-control__label">Orbit speed</span>
  <div class="speed-control__presets">
    <button type="button" class="speed-control__btn" [class.active]="speedMode() === 'real'" (click)="setSpeedMode('real')" title="Real orbital proportions">Real</button>
    <button type="button" class="speed-control__btn" [class.active]="speedMode() === 'uniform'" (click)="setSpeedMode('uniform')" title="All planets orbit at the same speed">Uniform</button>
    <button type="button" class="speed-control__btn" [class.active]="speedMode() === 'custom'" title="Custom speed multiplier">{{ customSpeed() }}×</button>
  </div>
  <input class="speed-control__slider" type="range" min="1" max="200" step="1" [value]="customSpeed()" (input)="onCustomSpeedChange($event)" aria-label="Speed multiplier" />
</div>

<div id="universe" class="universe__session">
  <div class="page-index">
    <div id="galaxy" class="galaxy-view--3D" appParallax #galaxyRef>

      <!-- Sun -->
      <div id="sun" class="orbit">
        <div class="planet-wrap">
          <div class="planet" role="button" tabindex="0" aria-label="Open Sun details"
            [style.viewTransitionName]="'planet-sun'"
            (click)="navigate('sun')"
            (keydown.enter)="navigate('sun')"
            (keydown.space)="navigate('sun'); $event.preventDefault()"></div>
        </div>
      </div>

      @for (planet of orbitPlanets(); track planet.name) {
        @if (planet.name === 'earth') {
          <div id="earth" class="orbit orbit-border" role="button" tabindex="0" aria-label="Open Earth details"
            (click)="navigate('earth')" (keydown.enter)="navigate('earth')" (keydown.space)="navigate('earth'); $event.preventDefault()">
            <div class="planet-wrap">
              <div class="planet" [style.viewTransitionName]="'planet-earth'">
                <div id="moon" class="orbit"><div class="planet-wrap"><div class="planet"></div></div></div>
              </div>
            </div>
          </div>
        } @else if (planet.name === 'saturn') {
          <div id="saturn" class="orbit orbit-border" role="button" tabindex="0" aria-label="Open Saturn details"
            (click)="navigate('saturn')" (keydown.enter)="navigate('saturn')" (keydown.space)="navigate('saturn'); $event.preventDefault()">
            <div class="planet-wrap">
              <div class="planet" [style.viewTransitionName]="'planet-saturn'"><div class="rings"></div></div>
            </div>
          </div>
        } @else if (planet.name === 'uranus') {
          <div id="uranus" class="orbit orbit-border" role="button" tabindex="0" aria-label="Open Uranus details"
            (click)="navigate('uranus')" (keydown.enter)="navigate('uranus')" (keydown.space)="navigate('uranus'); $event.preventDefault()">
            <div class="planet-wrap">
              <div class="planet" [style.viewTransitionName]="'planet-uranus'"><div class="rings"></div></div>
            </div>
          </div>
        } @else {
          <div [id]="planet.name" class="orbit orbit-border" role="button" tabindex="0"
            [attr.aria-label]="'Open ' + planet.name + ' details'"
            (click)="navigate(planet.name)"
            (keydown.enter)="navigate(planet.name)"
            (keydown.space)="navigate(planet.name); $event.preventDefault()">
            <div class="planet-wrap">
              <div class="planet" [style.viewTransitionName]="'planet-' + planet.name"></div>
            </div>
          </div>
        }
      }

      <!-- Asteroid belt -->
      <div id="asteroids" class="orbit">
        <div class="planet-wrap"><div class="planet"></div></div>
      </div>

    </div>
  </div>
</div>
