<!-- Feature 4: Compare button -->
<a class="compare-btn" routerLink="/compare" aria-label="Compare planets">⚖ Compare</a>

<app-menu [planets]="planets()"></app-menu>

<!-- Feature 7: Fullscreen toggle -->
<button
  class="fullscreen-btn"
  type="button"
  (click)="fullscreen.toggle()"
  [attr.aria-label]="fullscreen.isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
  [attr.title]="fullscreen.isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
>{{ fullscreen.isFullscreen() ? '✕' : '⤢' }}</button>

<!-- Feature 2: Orbit speed control panel -->
<div class="speed-control" role="group" aria-label="Orbit speed control">
  <span class="speed-control__label">Orbit speed</span>
  <div class="speed-control__presets">
    <button
      type="button"
      class="speed-control__btn"
      [class.active]="speedMode() === 'real'"
      (click)="setSpeedMode('real')"
      title="Real orbital proportions"
    >Real</button>
    <button
      type="button"
      class="speed-control__btn"
      [class.active]="speedMode() === 'uniform'"
      (click)="setSpeedMode('uniform')"
      title="All planets orbit at the same speed"
    >Uniform</button>
    <button
      type="button"
      class="speed-control__btn"
      [class.active]="speedMode() === 'custom'"
      title="Custom speed multiplier"
    >{{ customSpeed() }}×</button>
  </div>
  <input
    class="speed-control__slider"
    type="range"
    min="1"
    max="200"
    step="1"
    [value]="customSpeed()"
    (input)="onCustomSpeedChange($event)"
    aria-label="Speed multiplier"
  />
</div>
